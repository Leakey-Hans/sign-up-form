<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-up Form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="main-container">
        <div class="left-side">
            <div class="left-side-content">
                <img src="./assets/odin-lined-ligo.png" alt="odin lined logo">
                <div class="text-content">ODIN</div>
            </div>
            <div class="attribution">
                <p>Photo by <a href="https://unsplash.com/@mrbrodeur?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText" rel="noopener noreferrer" target="_blank">Matthew Brodeur</a> on <a href="https://unsplash.com/photos/coconut-tree-on-beach-DH_u2aV3nGM?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText"v rel="noopener noreferrer" target="_blank">Unsplash</a>
                </p>
            </div>
        </div>
        <div class="right-side">
            <div class="right-top">
                <h1 class="heading-1">Sign Up</h1><br>
                <p>Create your account and unlock everything in one place.<br>
                    Join a growing community building, learning, and achieving more every day.<br>
                    Fast, secure, and ready in under a minute.
                </p>
            </div>
            <form class="right-centre" action="#" method="#">
                <div class="form-container">
                    <div class="form-row">
                        <div class="form-input">
                            <label for="first-name">FIRST NAME</label>
                            <input type="text" id="first-name" name="first-name" required minlength="2" maxlength="10">
                        </div>
                        <div class="form-input">
                            <label for="last-name">LAST NAME</label>
                            <input type="text" id="last-name" name="last-name" required minlength="2" maxlength="10">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-input">
                            <label for="user-email">EMAIL</label>
                            <input type="email" id="user-email" name="email" required>
                        </div>
                        <div class="form-input">
                            <label for="tel">PHONE NUMBER</label>
                            <input type="tel" id="tel" name="tel" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-input">
                            <label for="password">PASSWORD</label>
                            <input type="password" id="password" name="password" required  minlength="8" maxlength="20">
                        </div>
                        <div class="form-input">
                            <label for="pass-confirm">CONFIRM PASSWORD</label>
                            <input type="password" id="pass-confirm"  name="pass-confirm" required minlength="8" maxlength="20">
                        </div>
                    </div>
                </div>
                <div class="btn-div">
                    <button type="submit">Create account</button>
                    <p>Already have an account? <a href="">Log in</a></p>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
